<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Hydrate 💧</title>

<style>
:root{
  --blue:#4da6ff;
  --red:#ff4d4d;
  --bg:linear-gradient(180deg,#f7fbff,#eaf4ff);
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.card{
  width:340px;
  padding:22px;
  border-radius:28px;
  background:rgba(255,255,255,.6);
  backdrop-filter:blur(20px);
  box-shadow:0 20px 40px rgba(0,0,0,.08);
  text-align:center;
}

/* SVG */
svg{ width:220px;height:260px }

/* glow */
.glow{
  filter:drop-shadow(0 0 25px rgba(77,166,255,1));
}

/* jiggle */
.jiggle{
  animation:jig .35s;
}
@keyframes jig{
  0%{transform:rotate(-2deg)}
  50%{transform:rotate(2deg)}
  100%{transform:rotate(0)}
}

/* fish */
.fish{
  position:absolute;
  font-size:22px;
  opacity:0;
}
.swim{
  animation:swim 3s linear forwards;
}
@keyframes swim{
  0%{left:-40px;opacity:1}
  100%{left:260px;opacity:1}
}

/* buttons */
button{
  border:none;
  border-radius:14px;
  padding:9px 14px;
  margin:4px;
  font-weight:600;
  background:#4da6ff;
  color:white;
}
.undo{background:#888}
.reset{background:#ff4d4d}

.progress{margin:10px;font-weight:600}

.message{margin-top:6px;font-weight:600;color:#ff4d4d}
</style>
</head>

<body>

<div class="card">

<h3>Hydrate 💧</h3>

<div style="position:relative">

<svg viewBox="0 0 200 260" id="svg">

<defs>
<clipPath id="clip" clipPathUnits="userSpaceOnUse">
  <path d="M100 10 C60 70 25 120 25 165
           A75 75 0 0 0 175 165
           C175 120 140 70 100 10Z"/>
</clipPath>

<linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#9be1ff"/>
  <stop offset="100%" stop-color="#1e88ff"/>
</linearGradient>
</defs>

<g clip-path="url(#clip)">
  <rect id="waterRect" x="0" y="260" width="200" height="0" fill="url(#waterGrad)"/>
</g>

<path id="outline"
d="M100 10 C60 70 25 120 25 165
   A75 75 0 0 0 175 165
   C175 120 140 70 100 10Z"
stroke="#4da6ff" stroke-width="6" fill="none"/>

</svg>

<div id="fish" class="fish">🐟</div>
</div>

<div class="progress" id="progress"></div>

<div>
<button onclick="add(100)">+100</button>
<button onclick="add(250)">+250</button>
<button onclick="add(500)">+500</button>
<button onclick="custom()">Custom</button>
<button onclick="undo()" class="undo">Undo</button>
<button onclick="resetDay()" class="reset">Reset</button>
</div>

<div class="message" id="message"></div>

</div>

<script>
const GOAL=1500
let history=[]

let data=JSON.parse(localStorage.getItem("hydration"))||{
  today:0
}

function save(){
  localStorage.setItem("hydration",JSON.stringify(data))
}

/* bubble sound */
function bubble(){
  const ctx=new AudioContext()

  function pop(freq,time){
    const o=ctx.createOscillator()
    const g=ctx.createGain()
    o.frequency.value=freq
    o.connect(g);g.connect(ctx.destination)
    g.gain.setValueAtTime(.2,ctx.currentTime+time)
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+time+.12)
    o.start(ctx.currentTime+time)
    o.stop(ctx.currentTime+time+.12)
  }

  pop(600,0); pop(900,.05); pop(1200,.1)
}

/* jiggle */
function jiggle(){
  const s=document.getElementById("svg")
  s.classList.add("jiggle")
  setTimeout(()=>s.classList.remove("jiggle"),300)
}

/* fish swim */
function fishSwim(){
  const f=document.getElementById("fish")
  f.classList.remove("swim")
  void f.offsetWidth
  f.classList.add("swim")
}

/* actions */
function add(v){
  history.push(v)
  data.today+=v
  bubble()
  jiggle()
  update()
}

function custom(){
  const v=parseInt(prompt("Enter ml"))
  if(v) add(v)
}

function undo(){
  if(!history.length) return
  data.today-=history.pop()
  update()
}

function resetDay(){
  data.today=0
  history=[]
  update()
}

/* update UI */
function update(){
  const pct=Math.min(100,(data.today/GOAL)*100)
  const h=260*(pct/100)

  const rect=document.getElementById("waterRect")
  rect.setAttribute("height",h)
  rect.setAttribute("y",260-h)

  document.getElementById("progress").innerText=
    `${data.today} / ${GOAL} ml`

  const msg=document.getElementById("message")
  msg.innerText=""

  if(data.today>=GOAL){
    document.getElementById("svg").classList.add("glow")
    msg.innerText="Good Girl💧"
    fishSwim()
  }else{
    document.getElementById("svg").classList.remove("glow")
  }

  save()
}

/* fun smart notifications */
function setupNotifications(){
  if(!("Notification" in window)) return
  Notification.requestPermission()

  const msgs=[
    "Sip time! 💧",
    "Your droplet is thirsty 😄",
    "Glug glug time 🫧",
    "Hydration check 🚰",
    "Drink water Madhu!!!",
    "Quick splash break!"
  ]

  setInterval(()=>{
    const remaining=Math.max(0,GOAL-data.today)
    const target=Math.round(remaining/4)

    const msg=msgs[Math.floor(Math.random()*msgs.length)]

    if(Notification.permission==="granted"){
      new Notification(msg,{body:`Have ~${target} ml now`})
    }
  },3*60*60*1000)
}

setupNotifications()
update()
</script>

</body>
</html>
