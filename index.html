<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Hydrate 💧</title>

<style>
:root{
  --blue:#4da6ff;
  --red:#ff4d4d;
  --bg:linear-gradient(180deg,#f7fbff,#eaf4ff);
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.card{
  width:340px;
  padding:22px;
  border-radius:28px;
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(20px);
  box-shadow:0 20px 40px rgba(0,0,0,.08);
  text-align:center;
}

svg{
  width:220px;
  height:260px;
}

/* glow */
.glow{
  filter:drop-shadow(0 0 24px rgba(77,166,255,1));
  animation:pulse 1.8s infinite;
}
@keyframes pulse{
  0%,100%{filter:drop-shadow(0 0 10px rgba(77,166,255,.6))}
  50%{filter:drop-shadow(0 0 30px rgba(77,166,255,1))}
}

button{
  border:none;
  border-radius:14px;
  padding:9px 14px;
  margin:4px;
  font-weight:600;
  background:var(--blue);
  color:white;
}
.undo{background:#888}
.reset{background:var(--red)}

.progress{margin:10px;font-weight:600}

/* graph */
.graph{
  margin-top:14px;
  height:60px;
  display:flex;
  align-items:flex-end;
  gap:6px;
  justify-content:center;
}
.bar{
  width:10px;
  background:#4da6ff;
  border-radius:6px;
  opacity:.7;
}

.streak{margin-top:6px;font-size:14px}
.message{margin-top:6px;font-weight:600;color:#ff4d4d}

/* 🌊 wave animation */
.wave{
  animation:waveMove 3s linear infinite;
}
@keyframes waveMove{
  from{transform:translateX(0)}
  to{transform:translateX(-40px)}
}
</style>
</head>

<body>

<div class="card">

<h3>Hydrate 💧</h3>

<svg id="svg" viewBox="0 0 200 260">

<defs>
<clipPath id="clip" clipPathUnits="userSpaceOnUse">
  <path d="M100 10 C60 70 25 120 25 165
           A75 75 0 0 0 175 165
           C175 120 140 70 100 10Z"/>
</clipPath>

<linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#9be1ff"/>
  <stop offset="100%" stop-color="#1e88ff"/>
</linearGradient>
</defs>

<!-- water group -->
<g clip-path="url(#clip)" id="waterGroup">

  <rect id="waterRect"
        x="0" y="260"
        width="200" height="0"
        fill="url(#waterGrad)"/>

  <!-- 🌊 wave overlay -->
  <path id="wave"
        class="wave"
        fill="rgba(255,255,255,.35)"
        d="M0 0 Q20 8 40 0 T80 0 T120 0 T160 0 T200 0 V40 H0Z"/>
</g>

<!-- outline -->
<path id="outline"
d="M100 10 C60 70 25 120 25 165
   A75 75 0 0 0 175 165
   C175 120 140 70 100 10Z"
stroke="#4da6ff" stroke-width="6" fill="none"/>

</svg>

<div class="progress" id="progress"></div>

<div>
<button onclick="add(100)">+100</button>
<button onclick="add(250)">+250</button>
<button onclick="add(500)">+500</button>
<button onclick="undo()" class="undo">Undo</button>
<button onclick="resetDay()" class="reset">Reset</button>
</div>

<div class="graph" id="graph"></div>
<div class="streak" id="streak"></div>
<div class="message" id="message"></div>

</div>

<script>
const GOAL=1500
let history=[]

let data=JSON.parse(localStorage.getItem("hydration"))||{
  today:0, streak:0, best:0,
  history:Array(7).fill(0),
  date:new Date().toDateString(),
  lastFail:false
}

function save(){
  localStorage.setItem("hydration",JSON.stringify(data))
}

/* 🫧 realistic bubbles/glug sound */
function bubble(){
  const ctx=new AudioContext()

  function pop(freq,time){
    const o=ctx.createOscillator()
    const g=ctx.createGain()
    o.frequency.value=freq
    o.type="sine"
    o.connect(g);g.connect(ctx.destination)
    g.gain.setValueAtTime(.15,ctx.currentTime+time)
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+time+.12)
    o.start(ctx.currentTime+time)
    o.stop(ctx.currentTime+time+.12)
  }

  pop(700,0)
  pop(900,.05)
  pop(600,.1)
  pop(1200,.15)
}

/* actions */
function add(v){
  history.push(v)
  data.today+=v
  bubble()
  update()
}

function undo(){
  if(!history.length) return
  data.today-=history.pop()
  update()
}

function resetDay(){
  if(!confirm("Reset today’s logs?")) return
  data.today=0
  history=[]
  update()
}

function update(){
  const pct=Math.min(100,(data.today/GOAL)*100)
  const h=260*(pct/100)

  const rect=document.getElementById("waterRect")
  rect.setAttribute("height",h)
  rect.setAttribute("y",260-h)

  document.getElementById("wave")
    .setAttribute("transform",`translate(0,${260-h-10})`)

  document.getElementById("progress").innerText=
    `${data.today} / ${GOAL} ml`

  save()
}

update()
</script>

</body>
</html>
