<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Hydrate 💧</title>

<style>
:root{
  --blue:#4da6ff;
  --red:#ff4d4d;
  --bg:linear-gradient(180deg,#f7fbff,#eaf4ff);
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.card{
  width:340px;
  padding:22px;
  border-radius:28px;
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(20px);
  box-shadow:0 20px 40px rgba(0,0,0,.08);
  text-align:center;
}

.droplet-wrap{
  width:220px;
  margin:auto;
  transition:.15s;
}
.droplet-wrap:active{transform:scale(.96)}

svg{
  width:220px;
  height:260px;
}

/* glow */
.glow{
  filter:drop-shadow(0 0 24px rgba(77,166,255,1));
  animation:pulse 1.8s infinite;
}
@keyframes pulse{
  0%,100%{filter:drop-shadow(0 0 10px rgba(77,166,255,.6))}
  50%{filter:drop-shadow(0 0 30px rgba(77,166,255,1))}
}

button{
  border:none;
  border-radius:14px;
  padding:9px 14px;
  margin:4px;
  font-weight:600;
  background:var(--blue);
  color:white;
}
.undo{background:#888}
.reset{background:var(--red)}

.progress{margin:10px;font-weight:600}

.graph{
  margin-top:14px;
  height:60px;
  display:flex;
  align-items:flex-end;
  gap:6px;
  justify-content:center;
}
.bar{
  width:10px;
  background:#4da6ff;
  border-radius:6px;
  opacity:.7;
}

.streak{margin-top:6px;font-size:14px}
.message{margin-top:6px;font-weight:600;color:#ff4d4d}
</style>
</head>

<body>

<div class="card">

<h3>Hydrate 💧</h3>

<div class="droplet-wrap" id="dropWrap">

<!-- PURE SVG SAFE VERSION -->
<svg viewBox="0 0 200 260">

<defs>
  <!-- 🔥 KEY FIX HERE -->
  <clipPath id="clip" clipPathUnits="userSpaceOnUse">
    <path d="M100 10
             C60 70 25 120 25 165
             A75 75 0 0 0 175 165
             C175 120 140 70 100 10Z"/>
  </clipPath>

  <linearGradient id="waterGradient" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#9be1ff"/>
    <stop offset="100%" stop-color="#1e88ff"/>
  </linearGradient>
</defs>

<!-- water -->
<rect id="waterRect"
      x="0"
      y="260"
      width="200"
      height="0"
      fill="url(#waterGradient)"
      clip-path="url(#clip)"/>

<!-- outline -->
<path id="outline"
      d="M100 10 C60 70 25 120 25 165 A75 75 0 0 0 175 165 C175 120 140 70 100 10Z"
      stroke="#4da6ff"
      stroke-width="6"
      fill="none"/>

</svg>

</div>

<div class="progress" id="progress"></div>

<div>
<button onclick="add(100)">+100</button>
<button onclick="add(250)">+250</button>
<button onclick="add(500)">+500</button>
<button onclick="undo()" class="undo">Undo</button>
<button onclick="resetDay()" class="reset">Reset</button>
</div>

<div class="graph" id="graph"></div>
<div class="streak" id="streak"></div>
<div class="message" id="message"></div>

</div>

<script>
const GOAL=1500
let history=[]

let data=JSON.parse(localStorage.getItem("hydration"))||{
  today:0, streak:0, best:0,
  history:Array(7).fill(0),
  date:new Date().toDateString(),
  lastFail:false
}

function save(){localStorage.setItem("hydration",JSON.stringify(data))}

/* bubble sound */
function bubble(){
  const ctx=new AudioContext()
  const o=ctx.createOscillator()
  const g=ctx.createGain()
  o.frequency.value=800
  o.connect(g);g.connect(ctx.destination)
  g.gain.setValueAtTime(.2,ctx.currentTime)
  g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.2)
  o.start();o.stop(ctx.currentTime+.2)
}

function add(v){
  history.push(v)
  data.today+=v
  bubble()
  data.lastFail=false
  update()
}

function undo(){
  if(!history.length) return
  data.today-=history.pop()
  update()
}

function resetDay(){
  if(!confirm("Reset today’s logs?")) return
  data.today=0
  history=[]
  update()
}

function update(){
  const pct=Math.min(100,(data.today/GOAL)*100)

  const rect=document.getElementById("waterRect")
  const h=260*(pct/100)
  rect.setAttribute("height",h)
  rect.setAttribute("y",260-h)

  const outline=document.getElementById("outline")
  const wrap=document.getElementById("dropWrap")
  const msg=document.getElementById("message")

  wrap.classList.remove("glow")
  msg.innerText=""

  if(data.today>=GOAL){
    wrap.classList.add("glow")
    msg.innerText="Good 💧"
    outline.setAttribute("stroke","#4da6ff")
  }
  else if(data.lastFail){
    outline.setAttribute("stroke","#ff4d4d")
    msg.innerText="Let’s hydrate better tomorrow 💧"
  }
  else{
    outline.setAttribute("stroke","#4da6ff")
  }

  document.getElementById("progress").innerText=`${data.today} / ${GOAL} ml`
  document.getElementById("streak").innerText=`🔥 ${data.streak} day streak • Best ${data.best}`

  drawGraph()
  save()
}

function drawGraph(){
  const g=document.getElementById("graph")
  g.innerHTML=""
  const max=Math.max(...data.history,GOAL)
  data.history.forEach(v=>{
    const b=document.createElement("div")
    b.className="bar"
    b.style.height=(v/max*60)+"px"
    g.appendChild(b)
  })
}

update()
</script>

</body>
</html>
